[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-page-guard"
version = "0.2.2"
description = "Approval-gated Facebook Page client for AI agents: signed plan, approval by a different identity, apply, changelog"
requires-python = ">=3.9"
license = {text = "MIT"}
optional-dependencies = {crypto = ["cryptography>=41"]}

[project.scripts]
fbguard = "fbguard.cli:main"

[tool.setuptools]
packages = ["fbguard"]
